# TRUSTLINE build graph (HEF v1.1.0 Graph Layer)
# Execution order for Claude Code. One node = one task prompt (prompts/nodes/).
# Lint:   python3 tools/graph_lint.py
# Render: python3 tools/render_node_prompts.py
# Edge conditions use `when` (YAML 1.1 parses `on` as a boolean).

graph:
  id: trustline_build
  version: 1.0.0
  hef_ref:
    name: TRUSTLINE
    version: 1.0.0
  entry: plan_build
  inputs:
    hef:
      type: file
      required: true
      default: TRUSTLINE.hef.md
    registry:
      type: file
      required: true
      default: spec/registry.yaml
  budget:
    total_tokens: 8000000
    max_wall_seconds: 259200
    reserve_fraction: 0.1
  budget_note: First-run planning budgets. Tune from tasks/trace.jsonl after M1; keep node ids stable.
policy:
  on_unrouted_exit:
    route_to: aborted
  max_concurrency: 2
  trace_path: tasks/trace.jsonl
  lessons_path: tasks/lessons.md
loops:
- id: plan_revise
  max_iterations: 2
- id: plan_human_revise
  max_iterations: 3
- id: fix_m1_loop
  max_iterations: 3
- id: fix_m2_loop
  max_iterations: 3
- id: fix_m3_loop
  max_iterations: 3
- id: fix_m4_loop
  max_iterations: 3
- id: fix_m5_loop
  max_iterations: 3
- id: fix_m6_loop
  max_iterations: 3
- id: fix_m7_loop
  max_iterations: 3
- id: demo_feedback_loop
  max_iterations: 3
nodes:
- id: plan_build
  kind: prompt
  objective: Produce an implementation plan for milestones M1 to M7 in tasks/todo.md that covers every must requirement
    and acceptance criterion, respects every hard limit, and names the files each task touches.
  implements:
  - M1
  - M2
  - M3
  - M4
  - M5
  - M6
  - M7
  critical: true
  inputs:
    spec:
      type: file
      source: $graph.input.hef
    registry:
      type: file
      source: $graph.input.registry
  outputs:
    plan_path:
      type: file
      required: true
    open_questions:
      type: list
      required: false
  contract:
    preconditions:
    - TRUSTLINE.hef.md, spec/registry.yaml and every file under docs/ have been read
    postconditions:
    - tasks/todo.md lists every task T1.1 to T7.5 as a checkbox with the files it touches
    - Every must requirement and every acceptance criterion id appears against at least one task
    - The plan names the crates, binaries and app routes exactly as in docs/02-architecture.md
    - Open questions are listed separately; none is silently decided
  context:
    mode: flat
    include:
    - hef.all
    - spec/registry.yaml
    - docs/01-product-brief.md
    - docs/02-architecture.md
    - docs/adr/
  reasoning:
    mode: got
    branches: 3
    merge: critique
    budget_multiplier: 2.5
  budget:
    max_input_tokens: 150000
    max_output_tokens: 20000
    max_calls: 60
    max_wall_seconds: 3600
  retry:
    max: 1
    mutate:
    - add_feedback
  prompt:
    role: Principal engineer planning a security-critical government system build
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
- id: verify_plan
  kind: verifier
  objective: Confirm the plan is complete, traceable and within the hard limits before any code is written.
  implements:
  - M1
  critical: false
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
  outputs:
    report:
      type: file
      required: true
    failures:
      type: list
      required: true
  contract:
    preconditions:
    - tasks/todo.md exists
    postconditions:
    - Every must requirement and acceptance criterion id is mapped to a task
    - No task contradicts a hard limit HL1 to HL12
    - Every task names its files and its verification
  context:
    mode: flat
    include:
    - hef.verification
    - spec/registry.yaml
  reasoning:
    mode: direct
  command: python3 tools/graph_lint.py --plan tasks/todo.md
  budget:
    max_input_tokens: 60000
    max_output_tokens: 6000
    max_calls: 20
    max_wall_seconds: 1800
  retry:
    max: 1
    mutate:
    - add_feedback
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
- id: approve_plan
  kind: human
  objective: Kelvin approves the plan or asks for changes before implementation starts.
  implements:
  - M1
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
    open_questions:
      type: list
      source: $node.plan_build.open_questions
  outputs:
    decision:
      type: string
      required: true
    notes:
      type: string
      required: false
  ask: Here is the implementation plan in tasks/todo.md and the open questions. Approve it, or tell me what to change.
  budget:
    max_input_tokens: 0
    max_output_tokens: 0
    max_calls: 1
    max_wall_seconds: 604800
  exits:
  - approved
  - rejected
  - timeout
- id: m1_scaffold
  kind: prompt
  objective: Create the Cargo workspace, compose stack, Makefile, CI and typed configuration with the DEV_AUTH guard.
  implements:
  - R12
  - T1.1
  - T1.2
  - T1.3
  - T1.4
  critical: false
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
  outputs:
    summary:
      type: string
      required: true
    files_touched:
      type: list
      required: true
  contract:
    preconditions:
    - Plan approved (tasks/todo.md exists and approve_plan exited approved)
    postconditions:
    - cargo build --workspace succeeds
    - make verify runs every gate listed in docs/08
    - DEV_AUTH with TRUSTLINE_ENV=production refuses to start (test)
    - .env.example contains no secret values
  context:
    mode: flat
    include:
    - hef.constraints
    - hef.architecture
    - CLAUDE.md
    - tasks/lessons.md
    - docs/02-architecture.md
    - docs/adr/0006-demo-auth-and-pilot-auth.md
  reasoning:
    mode: direct
  budget:
    max_input_tokens: 200000
    max_output_tokens: 60000
    max_calls: 120
    max_wall_seconds: 10800
  retry:
    max: 2
    mutate:
    - add_feedback
  files_touched:
  - Cargo.toml
  - crates/*/
  - services/mock-agencies/
  - docker-compose.yml
  - Makefile
  - .github/workflows/ci.yml
  - .env.example
  - crates/core/src/config.rs
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
- id: m1_schema
  kind: prompt
  objective: Turn db/schema.sql into sqlx migrations with roles and append-only triggers, plus the no-master-records
    schema test.
  implements:
  - R4
  - R12
  - T1.5
  critical: false
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
  outputs:
    summary:
      type: string
      required: true
    files_touched:
      type: list
      required: true
  contract:
    preconditions:
    - Plan approved (tasks/todo.md exists and approve_plan exited approved)
    - m1_scaffold exited success
    postconditions:
    - Migrations reproduce db/schema.sql exactly (diff of pg_dump --schema-only is empty)
    - App role cannot UPDATE or DELETE ledger.access_event
    - Schema test lists every table and fails if a master-record table appears
    - db/tests/disclosure_test.sql passes against the migrated database (DF1-DF28)
  context:
    mode: flat
    include:
    - hef.constraints
    - hef.architecture
    - CLAUDE.md
    - tasks/lessons.md
    - db/schema.sql
    - docs/03-data-model.md
    - db/tests/disclosure_test.sql
  reasoning:
    mode: direct
  budget:
    max_input_tokens: 200000
    max_output_tokens: 60000
    max_calls: 120
    max_wall_seconds: 10800
  retry:
    max: 2
    mutate:
    - add_feedback
  files_touched:
  - db/migrations/
  - crates/api/tests/schema.rs
  - Makefile
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
- id: m1_seed
