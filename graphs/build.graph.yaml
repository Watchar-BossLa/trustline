- id: apply_demo_feedback
  kind: prompt
  objective: Apply Kelvin's demo feedback within the existing scope and hard limits.
  implements:
  - M7
  critical: false
  inputs:
    notes:
      type: string
      source: $node.approve_demo.notes
  outputs:
    summary:
      type: string
      required: true
    files_touched:
      type: list
      required: true
  contract:
    preconditions:
    - approve_demo exited rejected with notes
    postconditions:
    - Each requested change is applied or explained as out of scope
    - No hard limit is crossed
  context:
    mode: flat
    include:
    - hef.constraints
    - hef.architecture
    - CLAUDE.md
    - tasks/lessons.md
    - docs/10-demo-script.md
  reasoning:
    mode: direct
  budget:
    max_input_tokens: 150000
    max_output_tokens: 40000
    max_calls: 80
    max_wall_seconds: 7200
  retry:
    max: 1
    mutate:
    - add_feedback
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
- id: done
  kind: terminal
  status: complete
  objective: Write hef_state as complete, append the run's lessons to tasks/lessons.md and stop.
  implements:
  - T7.5
- id: blocked
  kind: terminal
  status: blocked
  objective: Write hef_state with the blocker and the exact question for Kelvin, append lessons, and stop.
  implements:
  - T7.5
- id: aborted
  kind: terminal
  status: failed
  objective: Write hef_state with the failure, the last node and its exit, append lessons, and stop.
  implements:
  - T7.5
