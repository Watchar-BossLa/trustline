  contract:
    preconditions:
    - Plan approved (tasks/todo.md exists and approve_plan exited approved)
    - m1_schema exited success
    postconditions:
    - Personas S1 to S10 and officers in docs/09 exist after make seed
    - Same seed gives byte-identical fixtures
    - Every generated identifier starts with SYN and every name is from the fictional list
  context:
    mode: flat
    include:
    - hef.constraints
    - hef.architecture
    - CLAUDE.md
    - tasks/lessons.md
    - docs/09-synthetic-data.md
    - rules/
  reasoning:
    mode: direct
  budget:
    max_input_tokens: 200000
    max_output_tokens: 60000
    max_calls: 120
    max_wall_seconds: 10800
  retry:
    max: 2
    mutate:
    - add_feedback
  files_touched:
  - crates/cli/src/seed/
  - services/mock-agencies/fixtures/
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
- id: verify_m1
  kind: verifier
  objective: Confirm the foundation builds, migrates and seeds cleanly.
  implements:
  - V1.1
  - V1.2
  - V1.3
  - R12
  critical: false
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
  outputs:
    report:
      type: file
      required: true
    failures:
      type: list
      required: true
  contract:
    preconditions:
    - All build nodes of this milestone exited success
    postconditions:
    - V1.1 make verify passes on a clean clone
    - V1.2 migrations apply; ledger UPDATE/DELETE rejected
    - V1.3 seeding is deterministic
  context:
    mode: flat
    include:
    - hef.verification
    - docs/08-verification-plan.md
    - tasks/lessons.md
  reasoning:
    mode: direct
  command: make verify && make db && make seed && cargo test -p trustline-api --test schema && make db-test
  budget:
    max_input_tokens: 80000
    max_output_tokens: 8000
    max_calls: 40
    max_wall_seconds: 3600
  retry:
    max: 1
    mutate:
    - add_feedback
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
- id: fix_m1
  kind: prompt
  objective: Find the root cause of every failure reported by verify_m1 and fix it without widening M1 scope.
  implements:
  - M1
  critical: false
  inputs:
    plan:
      type: file
      source: $node.plan_build.plan_path
    failures:
      type: list
      source: $node.verify_m1.failures
  outputs:
    summary:
      type: string
      required: true
    files_touched:
      type: list
      required: true
  contract:
    preconditions:
    - verify_m1 exited fail with a non-empty failures list
    postconditions:
    - Each failure has a stated root cause and a fix, not a workaround
    - No test was weakened, skipped or deleted to make it pass
    - A lesson is appended to tasks/lessons.md for each distinct root cause
  context:
    mode: flat
    include:
    - hef.constraints
    - hef.architecture
    - CLAUDE.md
    - tasks/lessons.md
    - docs/08-verification-plan.md
  reasoning:
    mode: direct
  budget:
    max_input_tokens: 150000
    max_output_tokens: 40000
    max_calls: 80
    max_wall_seconds: 7200
  retry:
    max: 1
    mutate:
    - add_feedback
    - escalate_model
  exits:
  - success
  - fail
  - needs_input
  - budget_exceeded
  - timeout
  - blocked
