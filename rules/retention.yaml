# Retention proposals. LEGAL STATUS: NOT VERIFIED — proposals for Saint Lucian counsel and the
# Data Protection Commissioner, not legal positions. Nothing here is enforced as law until
# verified: true. Ledger data is never deleted row by row (HL8): at end of retention, closed
# monthly partitions are exported, signed, archived offline and detached.
version: 1.0.0
verified: false
proposals:
  - data: "ledger.access_event and ledger.access_event_subject"
    keep: "7 years"
    then: "signed export, offline archive, partition detached"
    rationale: "Accountability for every access; in line with typical limitation periods"
  - data: "ledger.checkpoint"
    keep: "permanent"
    rationale: "Public integrity anchors; no personal data"
  - data: "ledger.disclosure_deferral"
    keep: "7 years"
    rationale: "Oversight of deferrals"
  - data: "tickets.ticket, tickets.payment, tickets.court_referral"
    keep: "7 years after final disposition"
    rationale: "Court and revenue records"
  - data: "tickets.court_fine"
    keep: "7 years after payment"
    rationale: "Section 107 evidence"
  - data: "demerit.conviction"
    keep: "3 years after points expire or are cleared"
    rationale: "Section 179 history and appeals"
  - data: "demerit.proposed_action and demerit.licence_action"
    keep: "7 years"
    rationale: "Decisions and appeals"
  - data: "citizen.dispute"
    keep: "2 years after resolution"
  - data: "oversight.alert"
    keep: "7 years"
  - data: "oversight.monthly_report"
    keep: "permanent"
    rationale: "Published aggregates; no personal data"
  - data: "ems.emergency_card_consent"
    keep: "until withdrawn, plus 1 year"
    rationale: "Proof of consent"
  - data: "core.offline_bundle (metadata only)"
    keep: "90 days"
  - data: "application logs and traces"
    keep: "30 days"
    rationale: "Contain no identifiers by design"
